<h1>城市图书馆年度报告</h1>
<div class="cols">
<p>过去一年，城市图书馆共接待读者八十六万人次，比前一年增长百分之十二。新开设的儿童阅览室最受欢迎，周末经常座无虚席。</p>
<p>图书馆新增图书三万二千册，其中电子书占三分之一。读者可以在手机上借阅电子书，借期为二十一天，到期后自动归还。</p>
<h2>社区活动</h2>
<p>全年举办讲座和展览一百四十场，内容包括本地历史、科学普及和传统手工艺。每月一次的读书会吸引了大量退休读者参加。</p>
<p>明年图书馆计划延长开放时间，工作日开放到晚上九点，并在东区开设第二个分馆。</p>
</div>
