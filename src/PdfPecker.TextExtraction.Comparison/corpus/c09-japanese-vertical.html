<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Japanese vertical</title><link rel="stylesheet" href="base.css">
<style>@font-face { font-family: "Noto Sans JP"; src: url("fonts/NotoSansJP_400Regular.ttf"); } html, h1 { font-family: "Noto Sans JP", sans-serif; font-size: 12pt; } .v { writing-mode: vertical-rl; height: 220mm; line-height: 1.7; } h1 { font-size: 16pt; }</style></head><body><div class="v">
<h1>春の旅</h1>
<p>三月の終わりに、私は古い友人を訪ねて京都へ行きました。駅を出ると、空気はまだ少し冷たく、川沿いの桜はつぼみのままでした。</p>
<p>友人の家は静かな路地の奥にあり、小さな庭には梅の木が一本立っていました。私たちはお茶を飲みながら、学生時代の話を夜遅くまで続けました。</p>
<p>翌朝は早く起きて、山の上の寺まで歩きました。石段は長く、途中で何度も休みましたが、頂上から見た町の景色はすばらしいものでした。</p>
</div></body></html>
